[package]
name = "aoide-conduct"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Aoide session core: PTY multiplexer, session DAG, hook plumbing, liveness reaping."

[lib]
name = "aoide_conduct"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
aoide-protocol = { workspace = true }
aoide-storage = { workspace = true }
# Originally added Phase 5 for `screen send --agent`'s reuse of this
# crate's A2A drive path — that tenant moved out with `screen` at P-A1 of
# the binary-split workstream, and the a2a-agent family it drove was
# deleted outright afterward (nodes superseded it). The edge STAYS
# regardless: two tenants now — `who` (messaging workstream C2, landed) —
# `graph::who::who` calls `aoide_client::commands::pull_node_live` for its
# live per-node probe — and `resurrect`'s manifest remote-summon path (U4,
# command-defrag lane U) — `graph::resurrect::summon_remote` calls
# `aoide_client::commands::spawn_on_node` to summon a manifest spec whose
# `host` names a different, registered node through the same signed
# node-spawn wire `aoide node spawn` drives, never a re-implementation.
# Bends the charter table's "conduct/client are independent leaves under
# cli" a little either way — see the messaging workstream plan for why this
# edge doesn't cycle (client has no dependency back on conduct).
aoide-client = { workspace = true }
libc = { workspace = true }
# The check lane (task #139): `graph::send::hook_for_profile`'s SessionStart/
# Stop arms call `aoide_upkeep::checklane::{on_session_start,on_stop}` so the
# working-tree mechanical-integrity sweep `aoide soundcheck` already owns
# fires on the agent LOOP itself, not only when someone remembers to run it
# by hand. No cycle: `aoide-upkeep` depends on nothing in this crate.
aoide-upkeep = { workspace = true }

[dev-dependencies]
# The commands/hooks tests share the workspace rig (scratch dirs, EnvSaver,
# `env_lock`) — dev-only edge.
aoide-test-support = { workspace = true }
