[package]
name = "aoide-conduct"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Aoide session core: PTY multiplexer, session DAG, hook plumbing, liveness reaping."

[lib]
name = "aoide_conduct"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
aoide-protocol = { workspace = true }
aoide-storage = { workspace = true }
# Originally added Phase 5 for `screen send --agent`'s reuse of this
# crate's A2A drive path — that tenant moved out with `screen` at P-A1 of
# the binary-split workstream, and the a2a-agent family it drove was
# deleted outright afterward (peers superseded it). The edge STAYS
# regardless: the tenant is now `who` (messaging workstream C2, landed) —
# `graph::who::who` calls
# `aoide_client::commands::pull_peer_live` for its live per-peer probe.
# Bends the charter table's "conduct/client are independent leaves under
# cli" a little either way — see the messaging workstream plan for why this
# edge doesn't cycle (client has no dependency back on conduct).
aoide-client = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
# The commands/hooks tests share the workspace rig (scratch dirs, EnvSaver,
# `env_lock`) — dev-only edge.
aoide-test-support = { workspace = true }
