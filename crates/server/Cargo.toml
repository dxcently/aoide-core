[package]
name = "aoide-server"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Aoide's door serve-loops: the A2A JSON-RPC/HTTP server, the MCP stdio server, and the aoided policy skeleton. Untrusted input stops here."

[lib]
name = "aoide_server"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
aoide-protocol = { workspace = true }
aoide-storage = { workspace = true }
aoide-conduct = { workspace = true }
# `do_spawn` (a2a.rs) setsid()s a just-spawned conducted session so it
# survives the HTTP handler thread — the same direct `libc` edge `aoide-conduct`
# and `aoide-storage` already carry, not a new vendored crate.
libc = { workspace = true }

[dev-dependencies]
# Only the round-trip test that exercises `parse_message_send_params` (this
# crate's server-side inbound parser) against `build_message_send_body` (the
# CLIENT-side builder, `aoide-client`) needs this — a test-only edge, not a
# production dependency (a `server` crate must not depend on `client`).
aoide-client = { workspace = true }
