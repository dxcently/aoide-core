[package]
name = "aoide-song"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Aoide's ricing/design engine: the livery engine (schema validation, alias resolution, stage/hyprctl/osc/file emitters), geometry/border keyword computation, and live compositor apply. Rices portably."

[lib]
name = "aoide_song"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
aoide-protocol = { workspace = true }
aoide-storage = { workspace = true }

[dev-dependencies]
# The commands/* tests share the workspace rig (scratch dirs, EnvSaver,
# fixture payloads, `env_lock`) — dev-only edge.
aoide-test-support = { workspace = true }
