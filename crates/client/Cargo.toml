[package]
name = "aoide-client"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Aoide outbound: the peer-federation client (add/list/remove/pull/status), A2A wire builders, the melete neutral-event adapter, and the Melete MCP client (melete status/graph/call)."

[lib]
name = "aoide_client"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
aoide-protocol = { workspace = true }
aoide-storage = { workspace = true }
# task #84: `peer` commands resolve a per-peer outbound Authorization: Bearer
# value through the secrets broker's unix-socket wire
# (`aoide_secrets::client::resolve_bounded`, `commands::resolve_peer_bearer`)
# rather than sending no bearer at all. `aoide-secrets` depends on nothing in
# this crate's own tree (protocol/libc/serde/serde_json only), so no cycle.
aoide-secrets = { workspace = true }
# `tunnel` (P-S3) SIGTERMs a recorded ssh child's pid directly (`libc::kill`)
# — the same crate/version every other pid-signaling site in this workspace
# already depends on (`secrets::backend::kill_process_group`).
libc = { workspace = true }

[dev-dependencies]
# `daemon`'s tests mutate `AOIDE_DAEMON_SOCKET` — the shared env-serialization
# mutex every crate touching process-global env carries, dev-only edge
# (`pkgs/aoide/crates/AGENTS.md`).
aoide-test-support = { workspace = true }
