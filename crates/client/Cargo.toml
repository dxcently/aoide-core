[package]
name = "aoide-client"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Aoide outbound: the A2A client (agent add/list/remove/send), wire builders/parsers, and the melete neutral-event adapter."

[lib]
name = "aoide_client"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aoide-protocol = { path = "../protocol" }
aoide-storage  = { path = "../storage" }
