[package]
name = "aoide-secrets"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Aoide's secrets broker (Workstream SECRETS): hand-rolled RFC 2104/3174/6238 TOTP, otpauth:// URI construction, RFC 4648 base32, the single-use replay ledger, and policy-store types (P-V1); the unix-socket broker daemon, the client `secrets exec`, and the admin CLI commands (P-V2); `secrets enroll` + the requireTotp gate wired live, backend-preset docs (P-V3). `aoide-cli` depends on this crate as of P-V2."

[lib]
name = "aoide_secrets"
path = "src/lib.rs"

[dependencies]
# `aoide-protocol` (P-V2): Registry/Invocation/Outcome/Door/EventClass and
# the audit helpers `broker`/`commands` build on. `aoide-storage` (LANE
# IDENTITY P-ID4 — the "later phase" `policy.rs`'s module doc reserved
# this edge for): `attest::attested_caller`, the shared peercred-pid ->
# ancestry -> sealed-session -> verified-origin lookup the broker's
# per-secret `allowRemoteOrigin` gate keys on — ONE implementation, in the
# one crate below both this one and `aoide-conduct` in the DAG, never a
# copy of the walk here (the cross-crate copying ban). `libc` (P-V3):
# `enroll::local_hostname`'s `gethostname(2)` call and `peercred.rs`'s
# `SO_PEERCRED` read. Everything
# else stays the P-V1 ZERO-algorithmic-dependency half (no `sha1`/`hmac`/
# `totp-lite`/`data-encoding` crate anywhere in this tree — hand-rolled on
# purpose, see `AGENTS.md`); serde is for the policy/replay-ledger/backend-
# config (de)serialization contract, same as every other record-shape crate
# in this workspace. `secrets enroll`'s QR rendering shells out to `qrencode`
# when present on `PATH` — a runtime feature-detect, not a Cargo dependency.
aoide-protocol = { workspace = true }
aoide-storage = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
