[package]
name = "aoide-secrets"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Aoide's secrets broker (Workstream SECRETS): hand-rolled RFC 2104/3174/6238 TOTP, otpauth:// URI construction, RFC 4648 base32, the single-use replay ledger, and policy-store types (P-V1); the unix-socket broker daemon, the client `secrets exec`, and the admin CLI verbs (P-V2); `secrets enroll` + the requireTotp gate wired live, backend-preset docs (P-V3). `aoide-cli` depends on this crate as of P-V2."

[lib]
name = "aoide_secrets"
path = "src/lib.rs"

[dependencies]
# `aoide-protocol` (P-V2): Registry/Invocation/Outcome/Door/EventClass and
# the audit helpers `broker`/`commands` build on. `libc` (P-V3, new leaf
# dep — already a workspace dependency via `aoide-storage`, nothing new in
# the lockfile): `enroll::local_hostname`'s `gethostname(2)` call, the SAME
# precedent `aoide_storage::display::local_host_name` already uses (this
# crate doesn't depend on `aoide-storage` — see `policy.rs`'s module doc —
# so the ~10-line call is repeated rather than reached for). Everything
# else stays the P-V1 ZERO-algorithmic-dependency half (no `sha1`/`hmac`/
# `totp-lite`/`data-encoding` crate anywhere in this tree — hand-rolled on
# purpose, see `AGENTS.md`); serde is for the policy/replay-ledger/backend-
# config (de)serialization contract, same as every other record-shape crate
# in this workspace. `secrets enroll`'s QR rendering shells out to `qrencode`
# when present on `PATH` — a runtime feature-detect, not a Cargo dependency.
aoide-protocol = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
