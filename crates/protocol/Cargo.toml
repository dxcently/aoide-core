[package]
name = "aoide-protocol"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Aoide's one-schema-N-doors contract: registry, Outcome envelope, Door + audit, canonical_state."

[lib]
name = "aoide_protocol"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
