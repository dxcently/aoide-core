[package]
name = "aoide-vault"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Aoide's secrets broker, pure-logic half (Workstream VAULT, P-V1): hand-rolled RFC 2104/3174/6238 TOTP, otpauth:// URI construction, RFC 4648 base32, the single-use replay ledger, and policy-store types. No daemon, no socket, no CLI verbs — nothing in the workspace depends on this crate yet (the broker/client/registration land at P-V2/P-V3)."

[lib]
name = "aoide_vault"
path = "src/lib.rs"

[dependencies]
# serde/serde_json only — the TOTP stack itself (hmac/sha1/totp/base32/uri)
# is the plan-mandated ZERO-dependency half (no `sha1`/`hmac`/`totp-lite`/
# `data-encoding` crate anywhere in this tree); serde is for the policy/
# replay-ledger (de)serialization contract only, same as every other
# record-shape crate in this workspace.
serde = { workspace = true }
serde_json = { workspace = true }
