[package]
name = "aoide"
version = "0.0.0"
edition = "2021"
description = "Aoide CLI + daemon — an API that happens to be typeable."
license = "MIT"

# Phase-1 workspace scaffold (see docs/architecture/PACKAGE-LAYOUT.md): this
# manifest is both the `aoide` package and the workspace root, with the
# package as the workspace's sole member (no `members`/`crates/*` glob yet —
# there's nothing under crates/ to point it at). Future single-charter crates
# land under `crates/*` in later phases; until then this is a no-op that
# just makes the manifest workspace-shaped.
[workspace]
resolver = "2"
members = ["crates/protocol", "crates/storage", "crates/conduct", "crates/client", "crates/server", "crates/song"]

# Two binaries, one crate: the CLI trunk (`aoide`) and the daemon (`aoided`).
# Both share the same schema + handler code in `src/`, so the CLI door, the
# MCP door, and the daemon can never drift.

[[bin]]
name = "aoide"
path = "src/bin/aoide.rs"

[[bin]]
name = "aoided"
path = "src/bin/aoided.rs"

[lib]
name = "aoide"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aoide-protocol = { path = "crates/protocol" }
aoide-storage = { path = "crates/storage" }
aoide-conduct = { path = "crates/conduct" }
aoide-client = { path = "crates/client" }
aoide-server = { path = "crates/server" }
aoide-song = { path = "crates/song" }
# `aoide conductor` — the interactive terminal frontend (see src/conductor.rs), built on
# ratatui.rs over the crossterm backend (the rig's standard for every Aoide TUI:
# no hand-rolled ANSI). ratatui owns the immediate-mode render + the double
# buffer diff; we keep the loop, the event feed (the audit log), and mtime-poll
# live-state ourselves — no tokio, no notify. ratatui 0.30 pins crossterm 0.29,
# the same line we take directly for the event loop (raw mode, the alternate
# screen, and `event::poll`/`event::read` with a timeout), so the offline cargo
# lock carries ONE crossterm. default-features = false + only `events` on the
# direct dep keeps our surface minimal; ratatui pulls the backend features it
# needs (mio + signal-hook ride in with `events`).
crossterm = { version = "0.29", default-features = false, features = ["events"] }
ratatui = "0.30"
# `aoide conduct` — the PTY-backed conductor wrap (see src/graph.rs). libc gives
# us openpty + the controlling-tty ioctls (setsid/TIOCSCTTY/TIOCSWINSZ) and the
# poll()-based multiplexer that shuttles the real tty ↔ the pty master and the
# per-session injection socket → master. Already vendored (0.2.189, via
# crossterm's tree), so this is a direct edge on an already-locked crate — no new
# vendored crate enters the offline lock.
libc = "0.2"

[profile.release]
opt-level = "s"
