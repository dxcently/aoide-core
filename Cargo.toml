[package]
name = "aoide"
version = "0.0.0"
edition = "2021"
description = "Aoide CLI + daemon — an API that happens to be typeable."
license = "MIT"

# Phase-1 workspace scaffold (see docs/architecture/PACKAGE-LAYOUT.md): this
# manifest is both the `aoide` package and the workspace root, with the
# package as the workspace's sole member (no `members`/`crates/*` glob yet —
# there's nothing under crates/ to point it at). Future single-charter crates
# land under `crates/*` in later phases; until then this is a no-op that
# just makes the manifest workspace-shaped.
[workspace]
resolver = "2"
members = ["crates/protocol", "crates/storage", "crates/conduct", "crates/client", "crates/server", "crates/song", "crates/conductor"]

# Two binaries, one crate: the CLI trunk (`aoide`) and the daemon (`aoided`).
# Both share the same schema + handler code in `src/`, so the CLI door, the
# MCP door, and the daemon can never drift.

[[bin]]
name = "aoide"
path = "src/bin/aoide.rs"

[[bin]]
name = "aoided"
path = "src/bin/aoided.rs"

[lib]
name = "aoide"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aoide-protocol = { path = "crates/protocol" }
aoide-storage = { path = "crates/storage" }
aoide-conduct = { path = "crates/conduct" }
aoide-client = { path = "crates/client" }
aoide-server = { path = "crates/server" }
aoide-song = { path = "crates/song" }
# `aoide conductor` — the interactive terminal frontend, now its own crate
# (Phase 6b restructure, docs/architecture/PACKAGE-LAYOUT.md).
aoide-conductor = { path = "crates/conductor" }

[dev-dependencies]
# `tests/conductor_integration.rs` drives the conductor's app/ui layer
# directly (crossterm key events, a ratatui `TestBackend`) to exercise real
# dispatch end to end — so root still needs these two, but only as a
# dev-dependency now that the runtime code that used them lives in
# `aoide-conductor` (Phase 6b restructure). Same locked versions as before,
# not upgraded: ratatui 0.30 pins crossterm 0.29, the same line taken
# directly for crossterm's event types.
crossterm = { version = "0.29", default-features = false, features = ["events"] }
ratatui = "0.30"

[profile.release]
opt-level = "s"
