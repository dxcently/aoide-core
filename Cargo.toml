# Virtual workspace root (Phase 9 restructure,
# docs/architecture/PACKAGE-LAYOUT.md): NO [package], NO src/ — the app crate
# lives at `crates/cli`, single-charter crates under `crates/*`.
[workspace]
resolver = "2"
members = ["crates/protocol", "crates/storage", "crates/conduct", "crates/client", "crates/server", "crates/song", "crates/conductor", "crates/test-support", "crates/cli"]

# ONE version source for the whole workspace (the monorepo standard): every
# crate inherits via `{ workspace = true }` — no per-manifest version repeats.
# Versions match the pre-centralization manifests exactly; Cargo.lock must
# not shift. `crossterm`/`ratatui` carry the conductor TUI's pinning notes:
# ratatui 0.30 pins crossterm 0.29 (the rig's TUI standard — no hand-rolled
# ANSI); default-features = false + only `events` on the direct dep keeps the
# surface minimal and the offline lock on ONE crossterm (Phase 6b).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
crossterm = { version = "0.29", default-features = false, features = ["events"] }
ratatui = "0.30"
aoide-protocol = { path = "crates/protocol" }
aoide-storage = { path = "crates/storage" }
aoide-conduct = { path = "crates/conduct" }
aoide-client = { path = "crates/client" }
aoide-server = { path = "crates/server" }
aoide-song = { path = "crates/song" }
aoide-conductor = { path = "crates/conductor" }
aoide-test-support = { path = "crates/test-support" }

[profile.release]
opt-level = "s"
