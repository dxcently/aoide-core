[package]
name = "aoide"
version = "0.0.0"
edition = "2021"
description = "Aoide CLI + daemon — an API that happens to be typeable."
license = "MIT"

# Two binaries, one crate: the CLI trunk (`aoide`) and the daemon (`aoided`).
# Both share the same schema + handler code in `src/`, so the CLI door, the
# MCP door, and the daemon can never drift.

[[bin]]
name = "aoide"
path = "src/bin/aoide.rs"

[[bin]]
name = "aoided"
path = "src/bin/aoided.rs"

[lib]
name = "aoide"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `aoide baton` — a hand-rolled terminal frontend (see src/baton.rs). We take
# crossterm and NOTHING else: default features off, only `events` on (raw mode,
# the alternate screen, and `event::poll`/`event::read` with a timeout). No
# ratatui, no tokio, no notify — the renderer is ours, the event feed is the
# audit log, and live state is stage-file mtime polling. This is the smallest
# footprint that still gives us a resize-aware key loop (mio + signal-hook ride
# in with `events`), keeping the offline cargo lock as lean as crossterm allows.
crossterm = { version = "0.29", default-features = false, features = ["events"] }

[profile.release]
opt-level = "s"
